name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python tools/construire.py
  rls:
    # Row Level Security on a real Postgres: A and B cannot read or change each other's progress, anon has no access.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in tests/sql/supabase_stub.sql supabase/migrations/*.sql tests/sql/test_rls.sql; do
            echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
  navigateur:
    # Browser test of the opaque-origin iframe and nested Pyodide Worker: execution, hard stop, origin boundary and CSP network denial.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python tools/construire.py
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Serve generated site and wait for readiness
        run: |
          python -m http.server 8765 --directory _site > /tmp/site-server.log 2>&1 &
          echo $! > /tmp/site-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/a1/s01/index.html >/dev/null; then
              echo "Site server is ready"
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/a1/s01/index.html >/dev/null
      - name: Run browser tests
        run: |
          node tests/navigateur/python_worker.js
          node tests/navigateur/render_security.js
          node tests/navigateur/homepage.js
