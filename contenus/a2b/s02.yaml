    titre: "À toi de coder"
    minutes: 8
    intro: "Écris le corps des trois fonctions, sans IA. Les tests doivent tous passer."
    fichier: exercices/a2b/s02_vraisemblance.py
    depart: |
      def poisson_mle(counts):
          """Maximum likelihood estimate of the Poisson mean from a list of claim counts."""
          raise NotImplementedError

      def exponential_loglik(xs, theta):
          """Log-likelihood of an exponential distribution with mean theta."""
          raise NotImplementedError

      def pareto_alpha_mle(xs, theta):
          """Maximum likelihood estimate of alpha for a Pareto distribution with known theta."""
          raise NotImplementedError
    tests:
      - {nom: 'Poisson : $\hat{\lambda} = 2{,}5$', expr: "poisson_mle([3, 1, 4, 2, 0, 5, 2, 3, 1, 4]) == 2.5"}
      - {nom: 'Aucun sinistre : $\hat{\lambda} = 0$', expr: "poisson_mle([0, 0, 0]) == 0"}
      - {nom: '$\ell(1\,881{,}25) = -68{,}3175$', expr: "abs(exponential_loglik([1200, 800, 3500, 600, 2100, 950, 1700, 4200], 1881.25) + 68.317534) < 1e-6"}
      - {nom: 'La log-vraisemblance est maximale en $\bar{x}$', expr: "all(exponential_loglik([1200, 800, 3500, 600, 2100, 950, 1700, 4200], t) < exponential_loglik([1200, 800, 3500, 600, 2100, 950, 1700, 4200], 1881.25) for t in (1500, 1800, 1950, 2500))"}
      - {nom: 'Pareto : $\hat{\alpha} = 1{,}62156$', expr: "abs(pareto_alpha_mle([1200, 800, 3500, 600, 2100, 950, 1700, 4200], 2000) - 1.621558) < 1e-6"}
      - {nom: 'Un seul sinistre égal à $\theta$ : $\hat{\alpha} = 1 / \ln 2$', expr: "abs(pareto_alpha_mle([2000], 2000) - 1.4426950408889634) < 1e-12"}

