# Séance 1 du module A3 (Vie et mortalité).
# Chiffres : table MK (loi de Makeham), paramètres repris de Belgian-pension-simulator,
# config/tables/makeham.toml. Les valeurs sont recalculées par tests/test_contenus.py.
id: a3/s01
module: a3
titre: "Force de mortalité et espérance de vie"
en: "Force of mortality and life expectancy"
duree: 25
table: {nom: MK, k: 1000450.59, s: 0.999106875782, g: 0.999549614043, c: 1.103798111448, omega: 116}

actu_basics:
  # Module A3 du parcours Actuariat d'Actu-Basics (docs/actuariat/PARCOURS-ACTUARIAT-v3.md). Voir docs/ACTU-BASICS.md.
  episode: "A3 · Life insurance and mortality"
  statut: "à proposer"
  accroche_fr: "À 65 ans, combien d'années vous reste-t-il, en moyenne ?"
  accroche_en: "At 65, how many years do you have left, on average?"

etapes:
  - type: video
    titre: "L'intuition en vidéo"
    minutes: 3
    texte: >-
      La vidéo Actu-Basics de ce thème donne l'intuition : lire une table, passer de lₓ à une probabilité,
      puis à une espérance de vie. Elle n'existe pas encore. Quand elle sera publiée, elle s'affichera ici.

  - type: rappel
    titre: "Le rappel"
    minutes: 6
    blocs:
      - p: >-
          Ton simulateur travaille à âge entier : il connaît $l_x$, $p_x$ et $q_x$. Un cours complet, et les examens
          de la SOA, regardent aussi <b>l'instant</b> du décès. L'outil pour cela est la
          <b>force de mortalité</b> <i>(force of mortality)</i> $\mu_x$, le taux instantané de décès à l'âge exact $x$.
      - formule: |
          \begin{gathered}
          \mu_x = -\frac{\mathrm{d}}{\mathrm{d}x}\ln l_x \\[6pt]
          {}_tp_x = \frac{l_{x+t}}{l_x} = \exp\!\left(-\int_0^t \mu_{x+s}\,\mathrm{d}s\right)
          \end{gathered}
      - p: >-
          Pour la loi de Makeham de ton dépôt, $l_x = k\,s^x\,g^{c^x}$. En dérivant $\ln l_x$, on obtient une force
          qui croît de façon exponentielle avec l'âge. Avec $A = -\ln s$ et $B = -\ln g\,\ln c$, c'est la forme
          classique $A + Bc^x$, et la loi de Gompertz quand $A = 0$.
      - formule: |
          \mu_x = \underbrace{-\ln s}_{A} \;\underbrace{-\,\ln g\,\ln c}_{B}\; c^{x}
      - interactif: makeham
      - p: >-
          L'<b>espérance de vie abrégée</b> <i>(curtate life expectancy)</i> $e_x$ compte les années entières encore
          vécues. L'<b>espérance complète</b> <i>(complete life expectancy)</i> $\mathring{e}_x$ ajoute la fraction de
          l'année du décès.
      - formule: |
          \begin{gathered}
          e_x = \sum_{k\ge 1} {}_kp_x \\[6pt]
          \mathring{e}_x = \int_0^{\infty} {}_tp_x\,\mathrm{d}t \;\approx\; e_x + \tfrac12 \quad \text{(UDD)}
          \end{gathered}
      - note: >-
          En IAS 19, le choix de la table de mortalité modifie directement la DBO d'un plan
          de rentes. Tu le mesureras toi-même dans l'approfondissement A4+.
      - sources:
          - {titre: "Dickson, Hardy et Waters, Actuarial Mathematics for Life Contingent Risks, chap. 2 et 3", detail: "Modèles de survie, force de mortalité, âges fractionnaires"}
          - {titre: "SOA, Fundamentals of Actuarial Mathematics (FAM) Exam", url: "https://www.soa.org/education/exam-req/edu-exam-fam/", detail: "Syllabus officiel de l'examen"}
          - {titre: "ICA, 2024 Canadian Pensioner Mortality Research Project", url: "https://www.cia-ica.ca/publications/226032e/", detail: "La CPM2014 reste la table de référence pour les évaluations"}

  - type: quiz
    titre: "Vérifie"
    minutes: 4
    intro: "Quatre questions. Réponds sans relire le rappel."
    questions:
      - q: 'Pour la loi de Makeham, comment évolue $\mu_x$ avec l''âge ?'
        options: ["Linéairement", "Exponentiellement, à une constante près", "Elle est constante"]
        reponse: 1
        pourquoi: '$\mu_x = A + Bc^x$ avec $c > 1$ : la partie $Bc^x$ croît de façon exponentielle. $A$ est la part de mortalité indépendante de l''âge.'
      - q: 'Avec ${}_1p_{65} = 0{,}97$, ${}_2p_{65} = 0{,}94$ et une table qui s''arrête là, que vaut $e_{65}$ ?'
        options: ['$0{,}97$', '$1{,}91$', '$2{,}91$']
        reponse: 1
        pourquoi: '$e_x = \sum_{k\ge1} {}_kp_x$, donc $0{,}97 + 0{,}94 = 1{,}91$. Le terme $k = 0$ n''entre pas dans l''espérance abrégée.'
      - q: 'Sous l''hypothèse UDD, quel lien entre $\mathring{e}_x$ et $e_x$ ?'
        options: ['$\mathring{e}_x = e_x$', '$\mathring{e}_x \approx e_x + \tfrac12$', '$\mathring{e}_x \approx e_x - \tfrac12$']
        reponse: 1
        pourquoi: "Les décès sont répartis uniformément dans l'année : l'année du décès compte en moyenne pour une demi-année vécue."
      - q: "Une table plus prudente pour un plan de rentes doit…"
        options: ['augmenter les $q_x$', 'diminuer les $q_x$', 'ne rien changer']
        reponse: 1
        pourquoi: 'Pour une rente, le risque est la longévité : des $q_x$ plus faibles allongent les paiements et augmentent la réserve ou la DBO. Pour un capital décès, c''est l''inverse.'

  - type: calcul
    titre: "À la main"
    minutes: 5
    intro: "Table MK, effectifs arrondis à l'unité. Calcule avec une calculatrice, puis saisis tes résultats à 4 décimales."
    donnees:
      entetes: ['$x$', '65', '66', '67', '68']
      lignes: [['$l_x$', '716 046', '695 175', '672 905', '649 211']]
    champs:
      - {cle: p1, libelle: '${}_1p_{65}$', valeur: 0.9708524, tolerance: 0.00015}
      - {cle: p2, libelle: '${}_2p_{65}$', valeur: 0.9397511, tolerance: 0.00015}
      - {cle: p3, libelle: '${}_3p_{65}$', valeur: 0.9066611, tolerance: 0.00015}
      - {cle: e3, libelle: '$\sum_{k=1}^{3} {}_kp_{65}$', valeur: 2.8172646, tolerance: 0.00015}
    solution: |
      ${}_1p_{65} = \dfrac{695\,175}{716\,046} = 0{,}9709$, $\quad {}_2p_{65} = \dfrac{672\,905}{716\,046} = 0{,}9398$, $\quad {}_3p_{65} = \dfrac{649\,211}{716\,046} = 0{,}9067$.
      Somme : $2{,}8174$. Sur la table complète, $e_{65} = 12{,}32$ ans.

  - type: code
    titre: "À toi de coder"
    minutes: 6
    intro: "Écris le corps des deux fonctions, sans IA. Les tests doivent tous passer."
    fichier: exercices/a3/s01_survie.py
    depart: |
      K, S, G, C, OMEGA = 1000450.59, 0.999106875782, 0.999549614043, 1.103798111448, 116

      def l(x):
          """Number of survivors at integer age x, Makeham law: k * s**x * g**(c**x)."""
          raise NotImplementedError

      def curtate_life_expectancy(x):
          """e_x = sum of k_p_x for k = 1 .. OMEGA - x."""
          raise NotImplementedError
    tests:
      - {nom: '$l(65)$ vaut 716 046 à l''unité près', expr: "abs(l(65) - 716046) < 1"}
      - {nom: '$e_{40}$ vaut 32,138', expr: "abs(curtate_life_expectancy(40) - 32.138) < 0.001"}
      - {nom: '$e_{65}$ vaut 12,316', expr: "abs(curtate_life_expectancy(65) - 12.316) < 0.001"}
      - {nom: '$e_{65}$ est plus petit que $e_{40}$', expr: "curtate_life_expectancy(65) < curtate_life_expectancy(40)"}

  - type: vocabulaire
    titre: "Vocabulary"
    minutes: 1
    intro: "Clique sur une carte : le terme anglais et une phrase d'entretien d'embauche."
    cartes:
      - ["Force de mortalité", "force of mortality", "The force of mortality increases exponentially with age under Makeham's law."]
      - ["Espérance de vie abrégée", "curtate life expectancy", "The curtate expectation only counts complete years lived."]
      - ["Probabilité de survie", "survival probability", "I computed the ten-year survival probability from the life table."]
      - ["Table de mortalité", "mortality table, life table", "In Canada, pension valuations still use the CPM2014 table as the standard."]
      - ["Répartition uniforme des décès", "uniform distribution of deaths (UDD)", "Under UDD, the complete expectation is about half a year higher."]
      - ["Risque de longévité", "longevity risk", "Lower mortality rates increase the DBO of an annuity plan."]
