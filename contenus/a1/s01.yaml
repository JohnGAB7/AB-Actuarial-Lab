    fichier: exercices/a1/s01_interet.py
    depart: |
      def discount_factor(i, t):
          """v**t = (1 + i)**(-t)."""
          raise NotImplementedError

      def annuity_immediate(n, i):
          """a_n: n payments of 1, at the end of years 1 .. n."""
          raise NotImplementedError

      def annuity_due(n, i):
          """a-double-dot_n: n payments of 1, at the start of years 0 .. n-1."""
          raise NotImplementedError

      def present_value(cash_flows, i):
          """Present value of a dict {time: amount}."""
          raise NotImplementedError
    tests:
      - {nom: '$v^{10}$ vaut 0,78120 à 2,5 %', expr: "abs(discount_factor(0.025, 10) - 0.78120) < 0.00001"}
      - {nom: '$a_{\overline{10}|}$ vaut 8,75206 à 2,5 %', expr: "abs(annuity_immediate(10, 0.025) - 8.75206) < 0.00001"}
      - {nom: '$\ddot{a}_{\overline{10}|}$ vaut 8,97087 à 2,5 %', expr: "abs(annuity_due(10, 0.025) - 8.97087) < 0.00001"}
      - {nom: '$\ddot{a}_{\overline{n}|} = (1+i)\,a_{\overline{n}|}$', expr: "abs(annuity_due(20, 0.04) - 1.04 * annuity_immediate(20, 0.04)) < 1e-9"}
      - {nom: 'Avec $i = 0$, $a_{\overline{n}|} = n$', expr: "abs(annuity_immediate(7, 0) - 7) < 1e-12"}
      - {nom: '1 000 € à 5 ans et 500 € à 10 ans valent 1 274,45 €', expr: "abs(present_value({5: 1000, 10: 500}, 0.025) - 1274.45) < 0.01"}

