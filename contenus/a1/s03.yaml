  - type: quiz
    titre: "Vérifie"
    minutes: 4
    intro: "Quatre questions. Réponds sans relire le rappel."
    questions:
      - q: 'Une fondation veut verser 10 000 € par an pour toujours, à partir de dans un an. À 5 %, quel capital lui faut-il ?'
        options: ['200 000 €', '210 000 €', '500 000 €']
        reponse: 0
        pourquoi:
          rappel: >-
            C'est une perpétuité immédiate de 10 000 € : capital $= 10\,000 / i$.
          formule: |-
            P = \frac{C}{i}
          exemple: >-
            $10\,000 / 0{,}05 = 200\,000$ €. Chaque année, les intérêts de 10 000 € sont versés et le capital reste intact.
          piege: >-
            210 000 € correspond au premier paiement versé tout de suite (perpétuité due : $10\,000 / d$).
      - q: 'Dans 10 ans, combien aura-t-on en versant 1 000 € à la fin de chaque année, à 5 % ?'
        options: ['12 578 €', '10 000 €', '7 722 €']
        reponse: 0
        pourquoi:
          rappel: >-
            On cherche la valeur au temps 10 : c'est une valeur accumulée.
          formule: |-
            1\,000 \times s_{\overline{10}|} = 1\,000 \times \frac{1{,}05^{10} - 1}{0{,}05}
          exemple: >-
            $1{,}05^{10} = 1{,}628895$, donc $s_{\overline{10}|} = 12{,}5779$ et le total vaut 12 577,89 €.
          piege: >-
            7 722 € est la valeur actuelle des mêmes versements, au temps 0. 10 000 € oublie les intérêts.
      - q: 'À 5 % sur 10 ans, $(Da)_{\overline{10}|}$ est-elle plus grande ou plus petite que $(Ia)_{\overline{10}|}$ ?'
        options: ['Plus grande', 'Plus petite', 'Égale']
        reponse: 0
        pourquoi:
          rappel: >-
            Les deux versent le même total (55). L'annuité décroissante verse les gros montants au début, donc moins actualisés.
          formule: |-
            (Da)_{\overline{n}|} = (n+1)\,a_{\overline{n}|} - (Ia)_{\overline{n}|}
          exemple: >-
            $(Da)_{\overline{10}|} = 45{,}5653$ et $(Ia)_{\overline{10}|} = 39{,}3738$ ; leur somme vaut $11 \times 7{,}7217 = 84{,}9391$.
          piege: >-
            Sans intérêt, les deux vaudraient 55. Avec intérêt, l'ordre des paiements compte.
      - q: 'Une rente verse 1 000 € dans un an, puis croît de 2 % par an pendant 10 ans au total. À 5 %, elle vaut environ…'
        options: ['8 388 €', '7 722 €', '33 333 €']
        reponse: 0
        pourquoi:
          rappel: >-
            Annuité géométrique : premier paiement 1 000 €, raison $1{,}02$, actualisée à 5 %, sur 10 ans.
          formule: |-
            1\,000 \times \frac{1 - (1{,}02/1{,}05)^{10}}{0{,}05 - 0{,}02}
          exemple: >-
            $(1{,}02/1{,}05)^{10} = 0{,}748357$, donc la valeur vaut $1\,000 \times 0{,}251643 / 0{,}03 = 8\,388{,}11$ €.
          piege: >-
            33 333 € est la perpétuité croissante, sans fin. 7 722 € ignore la croissance.

  - type: calcul
    titre: "À la main"
    minutes: 5
    intro: "Taux de 5 %, sur 10 ans. Calcule avec une calculatrice, puis saisis tes résultats à 4 décimales."
    donnees:
      entetes: ['$i$', '$n$', '$g$']
      lignes: [['5 %', '10', '2 %']]
    champs:
      - {cle: s, libelle: '$s_{\overline{10}|}$', valeur: 12.5778925, tolerance: 0.0015}
      - {cle: ia, libelle: '$(Ia)_{\overline{10}|}$', valeur: 39.3737828, tolerance: 0.0015}
      - {cle: da, libelle: '$(Da)_{\overline{10}|}$', valeur: 45.5653014, tolerance: 0.0015}
      - {cle: geo, libelle: '$\sum_{k=1}^{10} (1+g)^{k-1}\,v^k$', valeur: 8.3881057, tolerance: 0.0015}
    solution: |
      $v^{10} = 0{,}613913$, $a_{\overline{10}|} = 7{,}7217$, $\ddot{a}_{\overline{10}|} = 8{,}1078$, $s_{\overline{10}|} = 0{,}628895 / 0{,}05 = 12{,}5779$.
      $$
      (Ia)_{\\overline{10}|}=\\frac{8{,}1078-10\\times0{,}613913}{0{,}05}=39{,}3738
      \\qquad (Da)_{\\overline{10}|}=\\frac{10-7{,}7217}{0{,}05}=45{,}5653
      \\qquad PV_{geo}=\\frac{0{,}251643}{0{,}03}=8{,}3881
      $$

