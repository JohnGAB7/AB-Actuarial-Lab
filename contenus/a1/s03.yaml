etapes:
  - type: quiz
    titre: "Test de positionnement"
    minutes: 3
    intro: "Quatre questions avant le cours. Si tu as tout juste, survole le rappel et va directement au calcul."
    questions:
      - q: 'Que vaut une perpétuité immédiate de 1 par an, au taux $i$ ?'
        options: ['$\dfrac{1}{i}$', '$\dfrac{1}{d}$', 'Elle est infinie']
        reponse: 0
        pourquoi:
          rappel: >-
            Une perpétuité (perpetuity) paie pour toujours, mais les paiements lointains sont fortement actualisés. La somme converge dès que $i > 0$.
          formule: |-
            a_{\overline{\infty}|} = \lim_{n \to \infty} \frac{1 - v^n}{i} = \frac{1}{i}
          exemple: >-
            À 5 %, toucher 1 € par an pour toujours vaut 20 € aujourd'hui : placés à 5 %, 20 € rapportent exactement 1 € par an.
          piege: >-
            $1/d$ est la perpétuité due, payée en début d'année : $1/d = 1/i + 1$.
      - q: 'Que représente $s_{\overline{n}|}$ ?'
        options: ['La valeur, au temps $n$, de $n$ paiements de 1 en fin d''année', 'La valeur actuelle de $n$ paiements de 1', 'La somme des intérêts reçus']
        reponse: 0
        pourquoi:
          rappel: >-
            $s_{\overline{n}|}$ est la valeur accumulée (accumulated value) : on capitalise chaque paiement jusqu'au temps $n$, au lieu de l'actualiser au temps 0.
          formule: |-
            s_{\overline{n}|} = \sum_{k=0}^{n-1} (1+i)^k = \frac{(1+i)^n - 1}{i} = (1+i)^n\,a_{\overline{n}|}
          exemple: >-
            À 5 % sur 10 ans : $s_{\overline{10}|} = 12{,}5779$, et $1{,}05^{10} \times 7{,}7217 = 12{,}5779$.
          piege: >-
            $s_{\overline{n}|}$ et $a_{\overline{n}|}$ décrivent les mêmes flux à deux dates différentes : $s_{\overline{n}|} = (1+i)^n\,a_{\overline{n}|}$.
      - q: 'L''annuité croissante $(Ia)_{\overline{n}|}$ verse…'
        options: ['1, 2, 3, …, $n$ en fin d''années 1 à $n$', '$n$, $n-1$, …, 1', '1 chaque année, indexé sur l''inflation']
        reponse: 0
        pourquoi:
          rappel: >-
            Le $I$ signifie « increasing » : le paiement de l'année $k$ vaut $k$. L'annuité décroissante $(Da)_{\overline{n}|}$ verse $n$, puis $n-1$, jusqu'à 1.
          formule: |-
            $(Ia)_{\overline{n}|} = \sum_{k=1}^{n} k\,v^k = \frac{\ddot{a}_{\overline{n}|} - n\,v^n}{i}$
          exemple: >-
            À 5 % sur 10 ans : $(Ia)_{\overline{10}|} = 39{,}3738$.
          piege: >-
            Une rente indexée sur l'inflation croît de façon géométrique, pas arithmétique : c'est une autre formule.
      - q: 'Une perpétuité verse 1 dans un an, puis croît de $g$ par an, avec $g < i$. Elle vaut…'
        options: ['$\dfrac{1}{i - g}$', '$\dfrac{1}{i + g}$', '$\dfrac{1+g}{i}$']
        reponse: 0
        pourquoi:
          rappel: >-
            Chaque terme vaut $(1+g)^{k-1} v^k$ : une suite géométrique de raison $\frac{1+g}{1+i} < 1$.
          formule: |-
            \sum_{k \ge 1} (1+g)^{k-1} v^k = \frac{1}{i - g} \qquad (g < i)
          exemple: >-
            À 5 % avec $g = 2\,\%$ : $1 / 0{,}03 = 33{,}33$, contre 20 sans croissance.
          piege: >-
            Si $g \ge i$, la somme diverge : la formule n'a plus de sens. C'est la formule de Gordon-Shapiro des analystes financiers.

  - type: video
    titre: "L'intuition en vidéo"
    minutes: 3
    texte: >-
      Ce thème n'a pas encore sa vidéo Actu-Basics. Elle montrera pourquoi une rente sans fin a un prix fini,
      et comment une petite croissance annuelle change beaucoup ce prix.

  - type: rappel
    titre: "Le rappel"
    minutes: 8
    blocs:
      - p: >-
          La <b>valeur accumulée</b> <i>(accumulated value)</i> d'une annuité est sa valeur à la date du dernier
          paiement. Elle se déduit de la valeur actuelle en capitalisant sur $n$ années.
      - formule: |
          \begin{gathered}
          s_{\overline{n}|} = \frac{(1+i)^n - 1}{i} = (1+i)^n\,a_{\overline{n}|} \qquad \ddot{s}_{\overline{n}|} = (1+i)\,s_{\overline{n}|}
          \end{gathered}
      - p: >-
          Une <b>perpétuité</b> <i>(perpetuity)</i> paie sans fin. Sa valeur est la limite de l'annuité quand $n \to \infty$ :
          un capital $1/i$ placé au taux $i$ produit exactement 1 par an, sans jamais s'épuiser.
      - formule: |
          a_{\overline{\infty}|} = \frac{1}{i} \qquad \ddot{a}_{\overline{\infty}|} = \frac{1}{d} = \frac{1}{i} + 1
      - p: >-
          Les <b>annuités variables</b> <i>(varying annuities)</i> changent de montant chaque année. Les deux familles
          classiques sont l'annuité <b>arithmétique</b> (croissante ou décroissante d'une unité par an) et l'annuité
          <b>géométrique</b> (croissance d'un pourcentage fixe).
      - formule: |
          \begin{gathered}
          (Ia)_{\overline{n}|} = \frac{\ddot{a}_{\overline{n}|} - n\,v^n}{i} \qquad (Da)_{\overline{n}|} = \frac{n - a_{\overline{n}|}}{i} \\[6pt]
          (Ia)_{\overline{n}|} + (Da)_{\overline{n}|} = (n+1)\,a_{\overline{n}|} \\[6pt]
          \sum_{k=1}^{n} (1+g)^{k-1} v^k = \frac{1 - \left(\frac{1+g}{1+i}\right)^{n}}{i - g} \quad (g \ne i)
          \end{gathered}
      - p: >-
          La relation $(Ia) + (Da) = (n+1)\,a_{\overline{n}|}$ se lit sur les flux : chaque année, $k + (n+1-k) = n+1$. C'est un bon
          moyen de vérifier un calcul.
      - note: >-
          Les rentes de retraite indexées sont des annuités géométriques. Pour un régime à prestations définies, un taux
          d'indexation de 2 % change la valeur des engagements presque autant qu'une baisse du taux d'actualisation.
      - sources:
          - {titre: "Kellison, The Theory of Interest, chap. 3 et 4", detail: "Valeur accumulée, perpétuités, annuités arithmétiques et géométriques"}
