# English texts for session A1.03. Numbers, answers and tests live in contenus/a1/s03.yaml.
titre: "Perpetuities and varying annuities"

fiche:
  vue_ensemble:
    question: "How do we value payments whose amounts change or that continue indefinitely?"
    pourquoi: "Varying annuities appear in indexed income, repayments, benefits and actuarial liabilities. Their value depends on timing, discount rate and pattern of change."
    objectifs:
      - "Distinguish present value from accumulated value."
      - "Derive immediate and due perpetuity values."
      - "Value increasing and decreasing arithmetic annuities."
      - "Value a finite geometric annuity and a growing perpetuity."
      - "Check convergence conditions and limiting cases."
    prerequis:
      - "Compound interest and discount factor."
      - "Certain immediate and due annuities."
      - "Finite and infinite geometric sums."
    carte:
      - "Accumulation: value at a future date."
      - "Perpetuities: limit of an annuity as duration tends to infinity."
      - "Arithmetic annuities: additive changes in payment."
      - "Geometric annuities: multiplicative changes in payment."
      - "Convergence: conditions for a finite value."
  cours_complet:
    sections:
      - titre: "1. Accumulated value"
        contenu: "The accumulated value of a unit immediate annuity at time n accumulates each payment to time n. For i≠0, it equals the present annuity value multiplied by (1+i)^n. If $i=0$, each payment remains $1$ and the value is $n$."
        formules:
          - explication: "The accumulated sum of n unit payments. When $i=0$, $s_n=n$."
      - titre: "2. Perpetuities immediate and due"
        contenu: "An immediate perpetuity pays $1$ at times $1;2;\\ldots$ and its present value is the limit of the annuity. For i>0, v^n tends to zero and the series converges. A due perpetuity begins at $t=0$: it is an immediate perpetuity advanced by one period. The effective discount rate is $d=i/(1+i)$."
        formules:
          - explication: "A capital 1/i earns 1 interest per period at rate i in this deterministic model."
          - explication: "The perpetuity due includes the payment immediately at $t=0$."
      - titre: "3. Arithmetic annuities"
        contenu: "The increasing annuity pays $1;2;\\ldots;n$ at times $1;\\ldots;n$. The decreasing annuity pays $n,n-1,\\ldots,1$. Both have the same nominal total, but for i>0 the decreasing annuity has a higher present value because its larger payments occur earlier."
        formules:
          - explication: "Formula for the increasing annuity, for i≠0."
          - explication: "Formula for the decreasing annuity, for i≠0."
          - explication: "Cash-flow check: at each date k, k+(n+1−k)=n+1."
      - titre: "4. Finite geometric annuity"
        contenu: "A payment of 1 at time 1 growing at rate g gives payment (1+g)^{k−1} at time k. Its discounted term is $(1+g)^{k-1}v^k$. Rates $i$ and $g$ must use the same period. The closed form applies when i≠g; if $i=g$, every discounted term equals $v$."
        formules:
          - explication: "Discounted geometric sum for an immediate annuity with constant growth."
          - explication: "Special case i=g: the closed form is 0/0 and must be replaced by the direct sum."
      - titre: "5. Growing perpetuity"
        contenu: "A growing perpetuity pays 1 at time 1, then grows at rate g. Its discounted series has ratio $(1+g)/(1+i)$. Under $i>-1$ and $g>-1$, convergence requires $g<i$. If g≥i, the terms do not tend to zero and the series diverges."
        formules:
          - explication: "Growing-perpetuity formula. First payment occurs in one year; rates and growth are constant and satisfy strict convergence."
      - titre: "6. Limiting cases and model limitations"
        contenu: "At zero interest, formulas dividing by $i$ are replaced by direct sums: accumulated value $n$, increasing arithmetic annuity $n(n+1)/2$ and decreasing annuity $n(n+1)/2$. A level perpetuity at i=0 diverges. A geometrically growing or declining perpetuity (with −1<g<0 for decline) converges when g<i under i>−1 and g>−1; it can therefore converge at zero interest when g<0. These models assume deterministic periodic cash flows and a constant rate; mortality, risk, taxes, expenses and a term structure are not automatically included."
        formules:
          - explication: "With zero interest, discounting and accumulation do not change the cash flows."
  methodes:
    methodes:
      - titre: "Identify the annuity type"
        quand_utiliser: "A periodic cash flow is constant, changes additively, or changes proportionally."
        etapes:
          - "Set the valuation date and draw the timeline."
          - "Write each cash flow amount and date."
          - "Identify the pattern: level, arithmetic or geometric."
          - "Check rate, period and convergence conditions."
          - "Choose a formula, calculate, then interpret."
        controles:
          - "The immediate payment distinguishes due from immediate annuities."
          - "A growing perpetuity requires $g<i$."
          - "Handle $i=0$ or $i=g$ separately."
        erreurs:
          - "Confusing additive growth with a percentage."
          - "Shifting payments by one period."
          - "Using $1/(i-g)$ without checking convergence."
          - "Using a formula with division by $i$ when $i=0$."
      - titre: "Verify using a cash-flow sum"
        quand_utiliser: "Check a closed form or compare annuity scenarios."
        etapes:
          - "Create the payment dates k."
          - "Define cash flow $C_k$ at each date."
          - "Discount by $C_k/(1+i)^k$."
          - "Sum present values and compare with the formula."
        controles:
          - "Both results agree within rounding tolerance."
          - "At i=0, present value equals nominal total."
          - "For i>0, a positive future payment is below its nominal amount."
        erreurs:
          - "Rounding factors before the final calculation."
          - "Using effective rates from different periods."
  exemples_guides:
    exemples:
      - titre: "Immediate perpetuity"
        enonce: "A foundation pays 10,000 per year starting in one year, forever. The annual effective rate is 5%."
        raisonnement:
          - "The first payment is at $t=1$: immediate perpetuity."
          - "Use C/i."
          - "Calculate 10,000/0.05."
        resultat: "PV=200,000 monetary units."
        interpretation: "The value is at $t=0$. A capital of $200,000$ earns $10,000$ interest each year at $5\\%$."
        controles:
          - "The due perpetuity would be one payment higher, or 210,000."
      - titre: "Arithmetic annuities over ten years"
        enonce: "At 5%, find the present values of payments 1, 2, …,10 and 10, 9, …, 1 at times 1 to 10."
        raisonnement:
          - "$a_{\\overline{10}|}=7.72173493$ and $\\ddot{a}_{\\overline{10}|}=8.10782168$."
          - "Use the increasing-annuity formula with the annuity due and the discounted final term."
          - "$(Da)=(10-a_{\\overline{10}|})/i$."
          - "Check their sum using 11a_10."
        resultat: "(Ia)=39.37378280; (Da)=45.56530142; total=84.93908422."
        interpretation: "The decreasing annuity has a higher present value because larger payments occur earlier."
        controles:
          - "Both nominal payment sequences total 55."
          - "The sum of present values equals 11a_10."
      - titre: "Geometric annuity"
        enonce: "An income of 1,000 is paid in one year, then grows by 2% annually for ten payments. The rate is 5%."
        raisonnement:
          - "$C_1=1,000$, $g=2\\%$, $i=5\\%$, $n=10$."
          - "Growth and discounting have the same annual periodicity."
          - "Use the finite formula because i≠g."
        resultat: "PV≈8,388.11. The level annuity of 1,000 is worth approximately 7,721.73."
        resultat: "PV≈8,388.11. The level annuity of 1,000 is worth approximately 7,721.73."
        interpretation: "Growth raises present value, while each cash flow is still discounted."
        controles:
          - "The direct sum of the ten discounted payments confirms the formula."
          - "The growing annuity is worth more than a level annuity when g>0."
  exercices_corriges:
    exercices:
      - titre: "Fundamental — perpetuity capital"
        enonce: "What capital funds 2,400 per year starting next year, at 4% effective?"
        corrige:
          - "The first payment is at t=1: immediate perpetuity."
          - "PV=2,400/0.04=60,000."
          - "At 4%, this capital earns 2,400 interest each year."
        feedback: "If you obtain 61,500, you may have treated the first payment as immediate. Check its date."
      - titre: "Intermediate — increasing annuity"
        enonce: "At 3%, value payments 1, 2, …,8 at each year-end."
        corrige:
          - "Calculate $v=1/1.03$ and $\\ddot{a}_{8|}=(1-v^8)/d$."
          - "Use the increasing-annuity identity and verify by a direct sum."
          - "Result: approximately $30.5003$; confirm using the sum $\\sum_{k=1}^{8}kv^k$."
        feedback: "The payment increases by one each year; this is not percentage indexation."
      - titre: "Advanced — convergence"
        enonce: "A perpetuity pays $1$ in one year and then grows by $3\\%$. Compare $i=5\\%$ and $i=2.5\\%$."
        corrige:
          - "At $5\\%$, $g<i$: $PV=1/(0.05-0.03)=50$."
          - "At 2.5%, g≥i: the series diverges and has no finite value."
          - "The condition is strict: g<i."
        feedback: "Always check convergence before using the formula."
  applications_labs:
    applications:
      - titre: "Indexed deterministic benefit"
        contexte: "Model an annual indexed payment for ten years. This illustrates indexation, with no risk or mortality."
        objectif: "Compare the closed form and direct sum, then measure the effect of indexation."
        entrees:
          - "First payment: $1,000$ at $t=1$."
          - "Growth $g=2\\%$, rate $i=5\\%$, duration $n=10$."
        hypotheses:
          - "Certain cash flows, constant rate and growth, annual dates."
          - "No mortality, expenses, tax, risk or currency change."
        procedure:
          - "Create $k=1,\\ldots,10$ and cash flow $1,000\\times1.02^{k-1}$."
          - "Discount by $(1.05)^k$ and sum."
          - |
            ```python
            n, i, g, first = 10, 0.05, 0.02, 1000.0
            pv_sum = sum(first * (1 + g) ** (k - 1) / (1 + i) ** k for k in range(1, n + 1))
            pv_closed = first * (1 - ((1 + g) / (1 + i)) ** n) / (i - g)
            pv_level = first * (1 - (1 + i) ** -n) / i
            assert abs(pv_sum - pv_closed) < 1e-10
            print(round(pv_sum, 2), round(pv_level, 2))
            ```
          - "Compare with a level annuity of 1,000."
        sorties:
          - "Present value of growing and level annuities."
          - "Value difference attributable to indexation."
        validation:
          - "Direct sum and closed form agree."
          - "The growing annuity is worth more than the level annuity."
          - "Handle i=g separately."
        limites:
          - "This is not a life-annuity or regulatory liability valuation."
          - "A term structure may replace the constant rate in practice."
  synthese_references:
    memo:
      - "Accumulated value: $s_{\\overline{n}|}=\\frac{(1+i)^n-1}{i}=(1+i)^n a_{\\overline{n}|}$; $i=0$: $n$."
      - "Immediate perpetuity: $1/i$; due: $1/d$, for $i>0$."
      - "Arithmetic: $(Ia)=\\frac{\\ddot{a}_{\\overline{n}|}-n v^n}{i}$; $(Da)=\\frac{n-a_{\\overline{n}|}}{i}$."
      - "Check: $(Ia)+(Da)=(n+1)a_{\\overline{n}|}$."
      - "Finite geometric: $\\frac{1-\\left(\\frac{1+g}{1+i}\\right)^n}{i-g}$; if $i=g$: $nv$."
      - "Growing perpetuity: $\\frac{1}{i-g}$, only if $g<i$."
      - "Check first payment date, rate units, convergence and limiting cases."
    glossaire:
      - {definition: "Value of payments accumulated to a future date."}
      - {definition: "A stream of payments with no final payment date."}
      - {definition: "Payments $1;2;\\ldots;n$ at successive dates."}
      - {definition: "Payments n, n−1, …, 1 at successive dates."}
      - {definition: "Payments multiplied by 1+g from one period to the next."}
      - {definition: "Rate that multiplies payment amounts from period to period."}
    references:
      - {titre: "Kellison, The Theory of Interest, chapters 3–4", detail: "Accumulated value, perpetuities and varying annuities. Edition and page numbers are not specified in the lesson source."}
      - {titre: "Society of Actuaries — Financial Mathematics (FM)", detail: "Official FM exam syllabus; a general reference source."}
    liens:
      - {titre: "A1/S01 — Compound interest and certain annuities"}
      - {titre: "A1/S02 — Nominal rates and fractional payments"}
    maitrise:
      - "I distinguish present value and accumulated value."
      - "I can explain perpetuity convergence."
      - "I can value arithmetic annuities and verify their identity."
      - "I handle i=g and i=0 without undefined division."
      - "I check dates, rate units and model limitations."

etapes:
  - titre: "Placement check"
    intro: "Four questions before the lesson. If you get them all right, skim the recap and go straight to the calculation."
    questions:
      - q: 'What is a perpetuity immediate of 1 a year worth, at rate $i$?'
        options: ['$\dfrac{1}{i}$', '$\dfrac{1}{d}$', 'It is infinite']
        pourquoi:
          rappel: >-
            A perpetuity pays forever, but distant payments are heavily discounted. The sum converges as soon as $i > 0$.
          exemple: >-
            At 5%, receiving €1 a year forever is worth €20 today: invested at 5%, €20 earns exactly €1 a year.
          piege: >-
            $1/d$ is the perpetuity due, paid at the start of each year: $1/d = 1/i + 1$.
      - q: 'What does $s_{\overline{n}|}$ represent?'
        options: ['The value at time $n$ of $n$ payments of 1 at the end of each year', 'The present value of $n$ payments of 1', 'The total interest received']
        pourquoi:
          rappel: >-
            $s_{\overline{n}|}$ is the accumulated value: each payment is accumulated to time $n$ instead of being discounted to time 0.
          exemple: >-
            At 5% over 10 years: $s_{\overline{10}|} = 12.5779$, and $1.05^{10} \times 7.7217 = 12.5779$.
          piege: >-
            $s_{\overline{n}|}$ and $a_{\overline{n}|}$ describe the same cash flows at two different dates: $s_{\overline{n}|} = (1+i)^n\,a_{\overline{n}|}$.
      - q: 'The increasing annuity $(Ia)_{\overline{n}|}$ pays…'
        options: ['1, 2, 3, …, $n$ at the end of years 1 to $n$', '$n$, $n-1$, …, 1', '1 a year, indexed to inflation']
        pourquoi:
          rappel: >-
            The $I$ stands for "increasing": the payment in year $k$ is $k$. The decreasing annuity $(Da)_{\\overline{n}|}$ pays $n$, then $n-1$, down to 1.
          exemple: >-
            At 5% over 10 years: $(Ia)_{\overline{10}|} = 39.3738$.
          piege: >-
            An inflation-indexed annuity grows geometrically, not arithmetically: that is a different formula.
      - q: 'A perpetuity pays 1 in one year, then grows by $g$ a year, with $g < i$. It is worth…'
        pourquoi:
          rappel: >-
            Each term is $(1+g)^{k-1} v^k$: a geometric series with ratio $\frac{1+g}{1+i} < 1$.
          exemple: >-
            At 5% with $g = 2\%$: $1 / 0.03 = 33.33$, against 20 with no growth.
          piege: >-
            If $g \ge i$, the sum diverges: the formula no longer makes sense. It is the Gordon growth model used by financial analysts.

  - titre: "The intuition on video"
    texte: >-
      This topic does not have its Actu-Basics video yet. It will show why an income without end has a finite price,
      and how a small yearly growth changes that price a lot.

  - titre: "The recap"
    blocs:
      - p: >-
          The <b>accumulated value</b> <i>(valeur accumulée)</i> of an annuity is its value at the date of the last
          payment. It follows from the present value by accumulating over $n$ years.
      - {}
      - p: >-
          A <b>perpetuity</b> <i>(perpétuité)</i> pays without end. Its value is the limit of the annuity as $n \to \infty$:
          a capital of $1/i$ invested at rate $i$ produces exactly 1 a year, without ever running out.
      - {}
      - p: >-
          <b>Varying annuities</b> <i>(annuités variables)</i> change amount each year. The two classic families are the
          <b>arithmetic</b> annuity (increasing or decreasing by one unit a year) and the <b>geometric</b> annuity (growing
          by a fixed percentage).
      - {}
      - p: >-
          The relation $(Ia) + (Da) = (n+1)\,a$ can be read from the cash flows: each year, $k + (n+1-k) = n+1$. It is a
          good way to check a calculation.
      - note: >-
          Indexed pensions are geometric annuities. For a defined benefit plan, an indexation rate of 2% changes the
          value of the obligations almost as much as a fall in the discount rate.
      - sources:
          - {titre: "Kellison, The Theory of Interest, chap. 3 and 4", detail: "Accumulated value, perpetuities, arithmetic and geometric annuities"}
          - {titre: "SOA, Financial Mathematics (FM) Exam", detail: "Official exam syllabus"}

  - titre: "Check"
    intro: "Four questions. Answer without rereading the recap."
    questions:
      - q: 'A foundation wants to pay €10,000 a year forever, starting in one year. At 5%, how much capital does it need?'
        options: ['€200,000', '€210,000', '€500,000']
        pourquoi:
          rappel: >-
            This is a perpetuity immediate of €10,000: capital $= 10{,}000 / i$.
          exemple: >-
            $10{,}000 / 0.05 = 200{,}000$ euros. Each year, the €10,000 of interest is paid out and the capital stays intact.
          piege: >-
            €210,000 corresponds to the first payment made right away (perpetuity due: $10{,}000 / d$).
      - q: 'How much will you have in 10 years by paying in €1,000 at the end of each year, at 5%?'
        options: ['€12,578', '€10,000', '€7,722']
        pourquoi:
          rappel: >-
            We want the value at time 10: that is an accumulated value.
          exemple: >-
            $1.05^{10} = 1.628895$, so $s_{\overline{10}|} = 12.5779$ and the total is €12,577.89.
          piege: >-
            €7,722 is the present value of the same payments, at time 0. €10,000 ignores interest.
      - q: 'At 5% over 10 years, is $(Da)_{\overline{10}|}$ larger or smaller than $(Ia)_{\overline{10}|}$?'
        options: ['Larger', 'Smaller', 'Equal']
        pourquoi:
          rappel: >-
            Both pay the same total (55). The decreasing annuity pays the large amounts first, so they are discounted less.
          exemple: >-
            $(Da)_{\overline{10}|} = 45.5653$ and $(Ia)_{\overline{10}|} = 39.3738$; their sum is $11 \times 7.7217 = 84.9391$.
          piege: >-
            Without interest, both would be worth 55. With interest, the order of the payments matters.
      - q: 'An annuity pays €1,000 in one year, then grows by 2% a year, for 10 years in all. At 5%, it is worth about…'
        options: ['€8,388', '€7,722', '€33,333']
        pourquoi:
          rappel: >-
            Geometric annuity: first payment €1,000, ratio $1.02$, discounted at 5%, over 10 years.
          exemple: >-
            $(1.02/1.05)^{10} = 0.748357$, so the value is $1{,}000 \times 0.251643 / 0.03 = 8{,}388.11$ euros.
          piege: >-
            €33,333 is the growing perpetuity, without end. €7,722 ignores the growth.

  - titre: "By hand"
    intro: "Rate of 5%, over 10 years. Use a calculator, then enter your results to 4 decimal places."
    donnees:
      entetes: ['$i$', '$n$', '$g$']
      lignes: [['5%', '10', '2%']]
    champs:
      - {libelle: '$s_{\overline{10}|}$'}
      - {libelle: '$(Ia)_{\overline{10}|}$'}
      - {libelle: '$(Da)_{\overline{10}|}$'}
      - {}
    solution: |
      $v^{10} = 0.613913$, $a_{\overline{10}|} = 7.7217$, $\ddot{a}_{\overline{10}|} = 8.1078$, $s_{\overline{10}|} = 0.628895 / 0.05 = 12.5779$.
      $(Ia)_{\overline{10}|} = (8.1078 - 10 \times 0.613913) / 0.05 = 39.3738$; $(Da)_{\overline{10}|} = (10 - 7.7217) / 0.05 = 45.5653$; geometric: $0.251643 / 0.03 = 8.3881$.

  - titre: "Your turn to code"
    intro: "Write the body of the four functions, without AI. All the tests must pass."
    tests:
      - {nom: '$s_{\overline{10}|}$ is 12.57789 at 5%'}
      - {nom: '$(Ia)_{\overline{10}|}$ is 39.37378 at 5%'}
      - {nom: '$(Da)_{\overline{10}|}$ is 45.56530 at 5%'}
      - {nom: '$(Ia) + (Da) = (n+1)\,a_{\overline{n}|}$'}
      - {nom: 'Geometric at 2%: 8.38811'}
      - {nom: 'Case $g = i$: $n\,v$'}

  - titre: "Vocabulary"
    intro: "Tap a card: the French term and a job-interview sentence."
